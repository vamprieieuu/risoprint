name: Build ResoPrint (MSVC x64)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pefile
      - name: Clean previous build artifacts
        shell: pwsh
        run: |
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          if (Test-Path "public/dist") { Remove-Item -Recurse -Force "public/dist" }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          New-Item -ItemType Directory -Force -Path "public/dist" | Out-Null
      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build ResoPrint
        run: cmake --build build --config Release --target ResoPrint --parallel
      - name: Locate and verify AEX
        shell: pwsh
        run: |
          $candidates = @(
            "build/bin/Release/ResoPrint.aex",
            "build/bin/ResoPrint.aex",
            "build/Release/ResoPrint.aex",
            "build/ResoPrint.aex",
            "dist/ResoPrint.aex"
          )
          $aexPath = $null
          foreach ($cand in $candidates) { if (Test-Path $cand) { $aexPath=(Get-Item $cand).FullName; break } }
          if (-not $aexPath) {
            $found=Get-ChildItem -Path build -Filter '*.aex' -Recurse -File | Select-Object -First 1
            if($found){$aexPath=$found.FullName}
          }
          if(-not $aexPath){Write-Error "ResoPrint.aex was not produced by the build.";exit 1}
          Copy-Item $aexPath "dist/ResoPrint.aex" -Force
          Copy-Item $aexPath "public/ResoPrint.aex" -Force
          Copy-Item $aexPath "public/dist/ResoPrint.aex" -Force
          Copy-Item $aexPath "ResoPrint.aex" -Force
          $f=Get-Item "dist/ResoPrint.aex"
          Write-Host "AEX: $($f.FullName)"
          Write-Host "Size: $($f.Length) bytes"
          Write-Host "SHA-256: $((Get-FileHash $f.FullName -Algorithm SHA256).Hash)"
      - name: Verify PiPL/resource
        shell: pwsh
        run: python ae/verify_build.py dist/ResoPrint.aex
      - name: Upload AEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResoPrint-AEX
          path: |
            dist/ResoPrint.aex
            public/dist/ResoPrint.aex
